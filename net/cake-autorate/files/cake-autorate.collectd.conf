# cake-autorate statistics feed for collectd.
#
# Installed by the package to /etc/collectd/conf.d/cake-autorate.conf. It is a
# self-contained drop-in: collectd Includes this directory, so we load and
# configure the `exec` plugin here rather than relying on luci-app-statistics'
# UCI-generated config.
#
# The reader script parses the daemon's SUMMARY log lines
# (/var/log/cake-autorate.*.log) and prints one PUTVAL per metric, with the
# collectd plugin instance set to the cake-autorate instance id so a multi-WAN
# setup produces distinct RRDs. See cake-autorate-collectd.sh for the exact
# field->metric and load-condition string->number mapping.
#
# `exec` (not `tail`) is used because the tail plugin cannot map the string
# load-condition to a number, nor label the plugin instance from the log
# filename. The reader sticks to the stock `bitrate` and `gauge` types, so there
# is no TypesDB change to make.
#
# LoadPlugin is idempotent in collectd; if the exec plugin is already loaded
# elsewhere (e.g. by collectd-mod-sqm) this simply adds another Exec program.

LoadPlugin exec

<Plugin exec>
	# Runs as the unprivileged "nobody" user; the daemon's log files under
	# /var/log are world-readable (mode 0644), so no elevated access is needed.
	Exec "nobody:nogroup" "/usr/libexec/collectd/cake-autorate-collectd.sh"
</Plugin>
