# cake-autorate OpenWrt package + LuCI UI — RELEASE.
#
# Trigger: pushing a `v*` tag. That is a deliberate maintainer action and it
# publishes IMMEDIATELY -- there is no draft step to review. Re-cutting means
# `gh release delete` + a new tag, so check the version bump before tagging.
#
# What it does:
#   1. Builds both packages from the TAGGED tree through the same reusable
#      `build.yml` that CI uses, so the released .apk files come off the exact
#      recipe (and the same assertions) that every push/PR is tested with.
#   2. Publishes them as GitHub Release assets, alongside a SHA256SUMS file.
#
# Why assets at all: until a signed apk repository exists, a Release is the only
# way for a router owner to get these packages without standing up an OpenWrt
# SDK. CI artifacts do not serve that purpose -- they are login-walled and
# expire. The SHA256SUMS file is also the input the future apk-index job needs.
#
# NOTE ON VERSIONS: the two packages number themselves differently, so the
# `validate` job below runs .github/scripts/package-versions.sh -- which owns
# both packages' version fields and is the authority on the rules:
#
#   * `luci-app-cake-autorate`'s PKG_VERSION *is* this tag (minus the `v`), with
#     PKG_RELEASE pinned at 1. It has no upstream, so the tag is its version.
#   * `cake-autorate`'s PKG_VERSION tracks UPSTREAM (3.2.2) and is not ours to
#     choose, so its PKG_RELEASE is the field that separates two packagings of
#     one upstream version -- reset on an upstream bump, +1 when the package
#     directory changed since the previous tag.
#
# This is a gate, not a formality: v0.1.0 and v0.2.0 both published
# `cake-autorate-3.2.2-r1.apk` and `luci-app-cake-autorate-1.0.0-r1.apk` with
# DIFFERENT payloads, and apk never offers a router a version string it already
# holds -- so v0.2.0's changes could not reach a v0.1.0 install, silently. The
# release notes still list the real built filenames, so there is no ambiguity
# about what a given tag shipped.

name: Release

on:
  push:
    tags:
      - "v*"

# Never let two runs publish the same tag concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate the build on the tag being well-formed AND on the package version
  # fields matching it. This is its own job, ahead of `build`, so a typo'd tag or
  # a forgotten version bump costs seconds rather than a full SDK build that then
  # refuses to publish -- which would leave a pushed tag with no release and no
  # obvious reason why.
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate the tag shape
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          # vX.Y.Z, optionally with a prerelease suffix (v1.2.0-rc1).
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error title=Bad tag::'$tag' is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          # A suffix marks it a prerelease, so an -rc never lands as "Latest".
          case "$tag" in
            *-*) pre=true ;;
            *)   pre=false ;;
          esac
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Tag $tag validated (prerelease=$pre)"

      # fetch-depth: 0 is REQUIRED, not tidiness: every rule the version check
      # applies is relative to the previous tag, which it finds with
      # `git describe`. A shallow clone has neither the tags nor the history to
      # resolve one, and the check would have nothing to compare against.
      - name: Checkout (full history + tags, for the version check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the package version contract
        run: .github/scripts/package-versions.sh

  # Same recipe as CI. Checkout inside the reusable workflow resolves to the
  # tag, so this builds the tagged tree, not main.
  build:
    needs: validate
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      # The only job in either workflow that writes. `build` stays read-only.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the built .apk files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.apk_artifact }}
          path: apks

      - name: Checksum the assets
        working-directory: apks
        run: |
          ls -l
          # Sorted so the file is reproducible regardless of glob order.
          sha256sum $(ls *.apk | sort) > SHA256SUMS
          cat SHA256SUMS

      - name: Compose the release notes
        env:
          CA_APK: ${{ needs.build.outputs.ca_apk }}
          LUCI_APK: ${{ needs.build.outputs.luci_apk }}
          # Absolute, not repo-relative: relative links resolve against the
          # release page URL, not the repo root, so `../../blob/...` 404s.
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # The body lives in .github/release-notes-template.md rather than a
          # heredoc: a heredoc inside a YAML block scalar has to carry the
          # block's indentation on every line, which mangles the fenced code
          # blocks. A real file is also reviewable and editable on its own.
          cp .github/release-notes-template.md notes.md
          # Package versions come from the build outputs, never from a literal
          # here -- PKG_VERSION/PKG_RELEASE move independently of the tag.
          sed -i "s|__CA_APK__|${CA_APK}|g; s|__LUCI_APK__|${LUCI_APK}|g; s|__REPO_URL__|${REPO_URL}|g" notes.md
          # sed's `r` cannot be used inline; splice the checksums with awk.
          awk 'FNR==NR{sums=sums $0 ORS; next} /^__SHASUMS__$/{printf "%s", sums; next} {print}' \
            apks/SHA256SUMS notes.md > notes.final.md
          mv notes.final.md notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --generate-notes appends the auto-derived commit changelog after our
          # body, so the release carries both the install instructions and the
          # what-changed list.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --prerelease=${{ needs.validate.outputs.prerelease }} \
            apks/*.apk apks/SHA256SUMS

      - name: Release summary
        if: always()
        run: |
          {
            echo "### Release \`${GITHUB_REF_NAME}\`"
            echo ""
            if [ -f apks/SHA256SUMS ]; then
              echo "Published assets:"
              echo ""
              echo '```'
              cat apks/SHA256SUMS
              echo '```'
            else
              echo "**FAILED** — no assets were published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
