# cake-autorate OpenWrt package + LuCI UI — Continuous Integration
#
# One workflow, three jobs, all pinned to OpenWrt 25.12.5:
#
#   build       Delegates to the reusable `build.yml`: 25.12.5 SDK, this repo as
#               a `src-link` feed, both packages built ONCE (PKG_ARCH:=all /
#               noarch, so there is NO per-arch matrix), .apk files uploaded as
#               the `cake-autorate-apks` artifact. `release.yml` calls the same
#               workflow on a v* tag, so a release ships what CI tested.
#   integration Boot the task-10 QEMU/KVM VM harness against the built apks.
#               needs: build.
#   ui          Run the task-11 functional + task-12 visual Playwright suites and
#               publish the human-review gallery. needs: build.
#
# KVM policy: GitHub-hosted `ubuntu-*` runners DO expose /dev/kvm (nested virt),
# so integration + ui-serve normally run for real. When a runner cannot
# virtualize (e.g. a self-hosted box without /dev/kvm, or a future runner-image
# regression) the VM-backed steps are skipped VISIBLY — a ::warning annotation
# plus a job-summary line — never a silent green pass. `build` and the `ui`
# gallery stay green independently so a KVM-less runner still yields signal.
#
# Self-hosted fallback: to guarantee virtualization, register a self-hosted
# runner on a KVM-capable host and change the `integration` / `ui` `runs-on:` to
# your runner label (e.g. [self-hosted, kvm]). The KVM-detection steps below then
# see /dev/kvm and run the VM for real with no other edits.
#
# Feed policy now lives with the build recipe it governs, in `build.yml`.

name: CI

on:
  # `push` is limited to main: without a branch filter, pushing a branch that
  # has an open PR ran the entire pipeline twice for the same commit.
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run for the same ref. Only PR runs are cancelled --
# a main run is the record for a commit that already landed, so it finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege: jobs only read the checkout and read/write artifacts.
permissions:
  contents: read

env:
  # The 25.12.5 pin for the VM-backed jobs. The SDK-side pins (archive name,
  # URL, apk output path) now live in build.yml, which is the only place that
  # touches the SDK -- a reusable workflow does NOT inherit the caller's env,
  # so duplicating them here would create two sources of truth for one version.
  OWRT_VERSION: "25.12.5"
  # The artifact build.yml publishes; consumed by both jobs below.
  APK_ARTIFACT: "cake-autorate-apks"

jobs:
  # ---------------------------------------------------------------------------
  # BUILD — set up the pinned SDK, build the feed once, publish the .apk files.
  #
  # The recipe itself lives in the reusable `build.yml` so that release.yml (v*
  # tags) builds through exactly the same steps. A release must ship what CI
  # tested, and a second copy of that ~200-line recipe would not stay identical.
  # ---------------------------------------------------------------------------
  build:
    uses: ./.github/workflows/build.yml

  # ---------------------------------------------------------------------------
  # INTEGRATION — boot the task-10 VM harness against the built apks (needs KVM).
  # ---------------------------------------------------------------------------
  integration:
    name: VM integration harness
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built .apk artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: apks

      - name: Install QEMU + e2fsprogs + python3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils e2fsprogs python3 wget gzip

      # /dev/kvm exists on hosted ubuntu-* runners but is root:kvm 0660 and the
      # runner user is not in the kvm group, so QEMU gets EACCES. This is the
      # standard udev rule for it (same one the Android emulator actions use).
      - name: Grant the runner access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      # QEMU user-mode networking sends guest ICMP through a Linux ping socket,
      # which the kernel restricts to GIDs inside net.ipv4.ping_group_range.
      # Hosted runners ship "1 0" -- an empty range -- so the guest boots and
      # then cannot ping at all: no route to downloads.openwrt.org for apk, and
      # no OWD measurement for cake-autorate's fping. run.sh gates on this too.
      - name: Allow unprivileged ICMP for QEMU user-mode networking
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          cat /proc/sys/net/ipv4/ping_group_range

      - name: Detect /dev/kvm
        id: kvm
        run: |
          # Test READ/WRITE, not mere existence: an unwritable /dev/kvm passes a
          # `-e` check and then fails inside QEMU, which under
          # CA_IT_REQUIRE_KVM=1 turns an environment problem into a hard failure
          # instead of the visible skip this job is designed to produce.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ] && qemu-system-x86_64 --version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM available — integration harness will run for real."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Integration skipped (no KVM)::/dev/kvm unavailable or not writable on this runner — the VM integration harness was skipped. Use a KVM-capable (hosted ubuntu-* or self-hosted) runner to run it."
          fi

      - name: Run integration harness (positive)
        if: steps.kvm.outputs.available == 'true'
        env:
          # Point the harness at the downloaded apks instead of the SDK bin path.
          CA_IT_APK_DIR: ${{ github.workspace }}/apks
          # Fail hard if KVM vanished between detection and here (no silent skip).
          CA_IT_REQUIRE_KVM: "1"
        run: ./tests/integration/run.sh

      - name: Run integration harness (negative self-test)
        if: steps.kvm.outputs.available == 'true'
        env:
          CA_IT_APK_DIR: ${{ github.workspace }}/apks
          CA_IT_REQUIRE_KVM: "1"
        run: |
          # A broken config MUST fail; a zero exit here means the assertions
          # have no teeth. Invert the exit code so "harness passed" == failure.
          if ./tests/integration/run.sh --negative; then
            echo "::error title=Negative self-test did not fail::run.sh --negative exited 0 — assertions are not enforcing"
            exit 1
          fi
          echo "Negative self-test correctly failed (assertions have teeth)."

      - name: Integration summary
        if: always()
        run: |
          {
            echo "### Integration (OpenWrt ${OWRT_VERSION} VM)"
            if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
              echo "KVM present — harness executed (positive + negative self-test)."
            else
              echo ":warning: **INTEGRATION SKIPPED: no KVM** — this runner cannot"
              echo "virtualize (/dev/kvm absent). This is a visible SKIP, not a pass."
              echo "Run on a KVM-capable hosted \`ubuntu-*\` or a self-hosted KVM runner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: tests/integration/artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # UI — task-11 functional + task-12 visual Playwright suites + review gallery.
  # ---------------------------------------------------------------------------
  ui:
    name: LuCI UI (Playwright functional + visual + gallery)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built .apk artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: apks

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install QEMU + e2fsprogs (serve mode boots the same VM)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils e2fsprogs python3 wget gzip

      # See the identical steps in `integration` for why these are needed: the
      # udev rule makes /dev/kvm writable, the sysctl lets QEMU's user-mode
      # networking send guest ICMP (without it the serve VM never gets online
      # and global-setup fails the whole suite).
      - name: Grant the runner access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Allow unprivileged ICMP for QEMU user-mode networking
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          cat /proc/sys/net/ipv4/ping_group_range

      - name: Install Playwright + Chromium
        working-directory: tests/ui
        run: |
          # `npm ci` (not `install`): package-lock.json is committed, so CI must
          # install exactly what it pins rather than silently resolving newer
          # versions of @playwright/test than the baselines were captured with.
          npm ci
          npx playwright install --with-deps chromium

      - name: Detect /dev/kvm
        id: kvm
        run: |
          # Read/write, not existence -- see the integration job's note.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ] && qemu-system-x86_64 --version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM available — UI suites will run against a live LuCI VM."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=UI VM suites skipped (no KVM)::/dev/kvm unavailable or not writable — the functional + visual suites need a live LuCI VM and were skipped. The review gallery (built from committed baselines) still publishes."
          fi

      - name: Run functional suite
        if: steps.kvm.outputs.available == 'true'
        working-directory: tests/ui
        env:
          # global-setup.js -> run.sh --serve reads CA_IT_APK_DIR for the apks.
          CA_IT_APK_DIR: ${{ github.workspace }}/apks
          CA_IT_REQUIRE_KVM: "1"
        run: npx playwright test --project=functional

      - name: Run visual suite (diff is advisory — never gates the pipeline)
        if: steps.kvm.outputs.available == 'true'
        working-directory: tests/ui
        env:
          CA_IT_APK_DIR: ${{ github.workspace }}/apks
          CA_IT_REQUIRE_KVM: "1"
        # Baselines are environment-specific (fonts/GPU); a pixel diff must not
        # fail CI. It uploads the HTML diff report for human review instead.
        continue-on-error: true
        run: npx playwright test --project=visual

      - name: Generate human-review gallery (from committed baselines)
        if: always()
        working-directory: tests/ui
        # Independent of KVM: the gallery is built from the committed baseline
        # PNGs, so it always publishes even when the VM steps were skipped.
        run: node visual/generate-gallery.js

      - name: UI summary
        if: always()
        run: |
          {
            echo "### UI (Playwright)"
            if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
              echo "KVM present — functional + visual suites ran against a live LuCI VM."
              echo "Visual diff is advisory (see the Playwright HTML report artifact)."
            else
              echo ":warning: **UI VM SUITES SKIPPED: no KVM** — functional + visual"
              echo "need a live LuCI VM and were skipped (visible SKIP, not a pass)."
            fi
            echo "Review gallery published as the \`ui-gallery\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report + visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/test-results/
          if-no-files-found: ignore

      - name: Upload review gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gallery
          path: tests/ui/visual/gallery/
          if-no-files-found: ignore
