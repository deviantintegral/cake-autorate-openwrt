# cake-autorate OpenWrt package + LuCI UI — Continuous Integration
#
# One workflow, three jobs, all pinned to OpenWrt 25.12.5:
#
#   build       Set up the 25.12.5 SDK, register THIS repo as a `src-link` feed,
#               build net/cake-autorate + luci/luci-app-cake-autorate ONCE
#               (packages are PKG_ARCH:=all / noarch, so there is NO per-arch
#               matrix) and upload the resulting .apk files.
#   integration Boot the task-10 QEMU/KVM VM harness against the built apks.
#               needs: build.
#   ui          Run the task-11 functional + task-12 visual Playwright suites and
#               publish the human-review gallery. needs: build.
#
# KVM policy: GitHub-hosted `ubuntu-*` runners DO expose /dev/kvm (nested virt),
# so integration + ui-serve normally run for real. When a runner cannot
# virtualize (e.g. a self-hosted box without /dev/kvm, or a future runner-image
# regression) the VM-backed steps are skipped VISIBLY — a ::warning annotation
# plus a job-summary line — never a silent green pass. `build` and the `ui`
# gallery stay green independently so a KVM-less runner still yields signal.
#
# Self-hosted fallback: to guarantee virtualization, register a self-hosted
# runner on a KVM-capable host and change the `integration` / `ui` `runs-on:` to
# your runner label (e.g. [self-hosted, kvm]). The KVM-detection steps below then
# see /dev/kvm and run the VM for real with no other edits.
#
# Feed policy: the SDK ships a feeds.conf.default that pins every upstream feed
# (base, packages, luci, routing, telephony, video) to an exact 25.12.5 commit.
# This workflow APPENDS its own src-link to that file rather than replacing it --
# luci-app-cake-autorate's Makefile does `include $(TOPDIR)/feeds/luci/luci.mk`,
# so without the luci feed the app cannot build at all. Only the feeds that are
# actually needed get `feeds update`d; see the feed step for why the rest are
# deliberately left alone.

name: CI

on:
  push:
  pull_request:

# Least-privilege: jobs only read the checkout and read/write artifacts.
permissions:
  contents: read

env:
  # Single source of truth for the 25.12.5 pin, reused by every job.
  OWRT_VERSION: "25.12.5"
  SDK_NAME: "openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64"
  SDK_ARCHIVE: "openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
  SDK_URL_DIR: "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64"
  # Where the .apk artifacts land inside the SDK, and what they are named.
  APK_SUBPATH: "bin/packages/x86_64/cakeautorate"
  APK_ARTIFACT: "cake-autorate-apks"

jobs:
  # ---------------------------------------------------------------------------
  # BUILD — set up the pinned SDK, build the feed once, publish the .apk files.
  # ---------------------------------------------------------------------------
  build:
    name: Build feed (OpenWrt 25.12.5 SDK)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDK host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd

      # Cache ONLY the SDK archive and the package downloads.
      #
      # build_dir is deliberately NOT cached. The SDK tarball already ships a
      # prebuilt kernel tree (~12.8k files, .ko included), so a cached build_dir
      # would mostly duplicate what the archive restores anyway; what it would
      # actually save is the per-run kmod .apk packaging, and several GB of
      # poorly-compressing cache traffic costs more than it saves.
      - name: Cache SDK archive + package downloads
        uses: actions/cache@v4
        with:
          # Bust the cache when the SDK pin or either package Makefile changes.
          key: owrt-${{ env.OWRT_VERSION }}-${{ hashFiles('net/cake-autorate/Makefile', 'luci/luci-app-cake-autorate/Makefile') }}
          restore-keys: |
            owrt-${{ env.OWRT_VERSION }}-
          path: |
            ~/sdk-cache
            ~/owrt-dl

      - name: Download + extract the 25.12.5 SDK
        run: |
          mkdir -p ~/sdk-cache ~/owrt-dl
          if [ ! -f ~/sdk-cache/"$SDK_ARCHIVE" ]; then
            echo "== fetching $SDK_ARCHIVE =="
            wget -q -O ~/sdk-cache/"$SDK_ARCHIVE" "$SDK_URL_DIR/$SDK_ARCHIVE"
          else
            echo "== using cached $SDK_ARCHIVE =="
          fi
          rm -rf "$GITHUB_WORKSPACE/sdk"
          mkdir -p "$GITHUB_WORKSPACE/sdk"
          tar --use-compress-program=unzstd \
            -xf ~/sdk-cache/"$SDK_ARCHIVE" \
            -C "$GITHUB_WORKSPACE/sdk" --strip-components=1
          # Point dl/ at the cached copy. It has to live outside the SDK tree:
          # the cache is restored BEFORE this step, and the `rm -rf` above would
          # otherwise delete whatever was restored into it -- which is exactly
          # why the previous dl//build_dir caching never saved any work.
          # Symlinking dl/ to a shared directory is standard OpenWrt practice.
          rm -rf "$GITHUB_WORKSPACE/sdk/dl"
          ln -s ~/owrt-dl "$GITHUB_WORKSPACE/sdk/dl"

      - name: Register this repo as the `cakeautorate` src-link feed
        working-directory: ${{ github.workspace }}/sdk
        run: |
          # APPEND to the shipped feed list; do NOT overwrite it. Replacing
          # feeds.conf.default with just our own src-link deleted the pinned
          # `luci` feed, and luci-app-cake-autorate/Makefile includes
          # $(TOPDIR)/feeds/luci/luci.mk -- so the build died with
          # "No rule to make target '.../feeds/luci/luci.mk'".
          cp feeds.conf.default feeds.conf
          echo "src-link cakeautorate $GITHUB_WORKSPACE" >> feeds.conf
          cat feeds.conf
          # `base` AND `luci` are both required, and neither is optional:
          #   luci -> luci.mk, luci-base, luci-app-statistics
          #   base -> the C libraries luci-base itself pulls in (liblua,
          #           libucode, libubox, libubus, libnl-tiny, rpcd, iwinfo).
          #           Without it lucihttp dies on a missing <lua.h>.
          # The SDK ships only package/kernel + package/toolchain, so ALL base
          # userland comes from this feed.
          #
          # `packages`/`routing`/`telephony`/`video` stay un-updated on purpose:
          # cake-autorate's remaining runtime deps (bash, fping, sqm-scripts,
          # collectd-mod-exec) are written into the .apk metadata whether or not
          # they exist at build time -- verified: the produced apk records
          # "depends: libc bash fping tc-tiny kmod-sched-cake sqm-scripts
          # collectd-mod-exec" -- and apk resolves them from the official repos
          # on the device. The integration job proves that for real in a VM,
          # which beats a build-time presence check, and pulling `packages` in
          # would add a from-source collectd + rrdtool build for no new signal.
          # Their "which does not exist" warnings during this step are expected.
          ./scripts/feeds update base luci cakeautorate
          # `install -a`, not `-a -p cakeautorate`: -p restricts installation to
          # our own feed, which leaves luci-base's dependencies un-symlinked into
          # package/feeds/ and the build fails to resolve them. Installing
          # everything only creates symlinks -- `make package/<x>/compile` still
          # builds nothing but <x> and its actual dependency chain.
          ./scripts/feeds install -a

      - name: Configure the build
        working-directory: ${{ github.workspace }}/sdk
        run: |
          # Select our two packages and let defconfig resolve the rest.
          #
          # This step used to claim it avoided CONFIG_ALL. It does not: defconfig
          # sets CONFIG_ALL / ALL_KMODS / ALL_NONSHARED=y no matter what is
          # written here, so ~1160 kmods end up selected and building
          # cake-autorate (via its +kmod-sched-cake dep) packages every one of
          # them into an .apk -- a few minutes per run. Writing explicit
          # "# CONFIG_PACKAGE_kmod-... is not set" lines does NOT survive
          # defconfig (verified), so this cost is accepted rather than fought.
          {
            echo "CONFIG_PACKAGE_cake-autorate=m"
            echo "CONFIG_PACKAGE_luci-app-cake-autorate=m"
          } > .config
          make defconfig

      - name: Build cake-autorate
        working-directory: ${{ github.workspace }}/sdk
        run: make package/cake-autorate/compile V=s

      - name: Build luci-app-cake-autorate
        working-directory: ${{ github.workspace }}/sdk
        run: make package/luci-app-cake-autorate/compile V=s

      - name: Collect + list the built .apk files
        working-directory: ${{ github.workspace }}/sdk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apks"
          # PKG_ARCH:=all -> the apks live under the x86_64 feed dir but are noarch.
          find "$APK_SUBPATH" -name '*.apk' -print -exec cp {} "$GITHUB_WORKSPACE/apks/" \;
          echo "== apks staged for upload =="
          ls -l "$GITHUB_WORKSPACE/apks"
          test -n "$(ls -A "$GITHUB_WORKSPACE/apks")" || { echo "ERROR: no .apk produced"; exit 1; }

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Build (OpenWrt ${OWRT_VERSION})"
            if [ -d "$GITHUB_WORKSPACE/apks" ] && [ -n "$(ls -A "$GITHUB_WORKSPACE/apks" 2>/dev/null)" ]; then
              echo "Built noarch packages (no per-arch matrix):"
              echo ""
              ( cd "$GITHUB_WORKSPACE/apks" && for f in *.apk; do echo "- \`$f\`"; done )
            else
              echo "**FAILED** — no .apk artifacts were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .apk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: apks/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # INTEGRATION — boot the task-10 VM harness against the built apks (needs KVM).
  # ---------------------------------------------------------------------------
  integration:
    name: VM integration harness
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built .apk artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: apks

      - name: Install QEMU + e2fsprogs + python3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils e2fsprogs python3 wget gzip

      # /dev/kvm exists on hosted ubuntu-* runners but is root:kvm 0660 and the
      # runner user is not in the kvm group, so QEMU gets EACCES. This is the
      # standard udev rule for it (same one the Android emulator actions use).
      - name: Grant the runner access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      # QEMU user-mode networking sends guest ICMP through a Linux ping socket,
      # which the kernel restricts to GIDs inside net.ipv4.ping_group_range.
      # Hosted runners ship "1 0" -- an empty range -- so the guest boots and
      # then cannot ping at all: no route to downloads.openwrt.org for apk, and
      # no OWD measurement for cake-autorate's fping. run.sh gates on this too.
      - name: Allow unprivileged ICMP for QEMU user-mode networking
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          cat /proc/sys/net/ipv4/ping_group_range

      - name: Detect /dev/kvm
        id: kvm
        run: |
          # Test READ/WRITE, not mere existence: an unwritable /dev/kvm passes a
          # `-e` check and then fails inside QEMU, which under
          # CA_IT_REQUIRE_KVM=1 turns an environment problem into a hard failure
          # instead of the visible skip this job is designed to produce.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ] && qemu-system-x86_64 --version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM available — integration harness will run for real."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Integration skipped (no KVM)::/dev/kvm unavailable or not writable on this runner — the VM integration harness was skipped. Use a KVM-capable (hosted ubuntu-* or self-hosted) runner to run it."
          fi

      - name: Run integration harness (positive)
        if: steps.kvm.outputs.available == 'true'
        env:
          # Point the harness at the downloaded apks instead of the SDK bin path.
          CA_IT_APK_DIR: ${{ github.workspace }}/apks
          # Fail hard if KVM vanished between detection and here (no silent skip).
          CA_IT_REQUIRE_KVM: "1"
        run: ./tests/integration/run.sh

      - name: Run integration harness (negative self-test)
        if: steps.kvm.outputs.available == 'true'
        env:
          CA_IT_APK_DIR: ${{ github.workspace }}/apks
          CA_IT_REQUIRE_KVM: "1"
        run: |
          # A broken config MUST fail; a zero exit here means the assertions
          # have no teeth. Invert the exit code so "harness passed" == failure.
          if ./tests/integration/run.sh --negative; then
            echo "::error title=Negative self-test did not fail::run.sh --negative exited 0 — assertions are not enforcing"
            exit 1
          fi
          echo "Negative self-test correctly failed (assertions have teeth)."

      - name: Integration summary
        if: always()
        run: |
          {
            echo "### Integration (OpenWrt ${OWRT_VERSION} VM)"
            if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
              echo "KVM present — harness executed (positive + negative self-test)."
            else
              echo ":warning: **INTEGRATION SKIPPED: no KVM** — this runner cannot"
              echo "virtualize (/dev/kvm absent). This is a visible SKIP, not a pass."
              echo "Run on a KVM-capable hosted \`ubuntu-*\` or a self-hosted KVM runner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: tests/integration/artifacts/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # UI — task-11 functional + task-12 visual Playwright suites + review gallery.
  # ---------------------------------------------------------------------------
  ui:
    name: LuCI UI (Playwright functional + visual + gallery)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built .apk artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: apks

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install QEMU + e2fsprogs (serve mode boots the same VM)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils e2fsprogs python3 wget gzip

      # See the identical steps in `integration` for why these are needed: the
      # udev rule makes /dev/kvm writable, the sysctl lets QEMU's user-mode
      # networking send guest ICMP (without it the serve VM never gets online
      # and global-setup fails the whole suite).
      - name: Grant the runner access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Allow unprivileged ICMP for QEMU user-mode networking
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          cat /proc/sys/net/ipv4/ping_group_range

      - name: Install Playwright + Chromium
        working-directory: tests/ui
        run: |
          # `npm ci` (not `install`): package-lock.json is committed, so CI must
          # install exactly what it pins rather than silently resolving newer
          # versions of @playwright/test than the baselines were captured with.
          npm ci
          npx playwright install --with-deps chromium

      - name: Detect /dev/kvm
        id: kvm
        run: |
          # Read/write, not existence -- see the integration job's note.
          if [ -r /dev/kvm ] && [ -w /dev/kvm ] && qemu-system-x86_64 --version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM available — UI suites will run against a live LuCI VM."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=UI VM suites skipped (no KVM)::/dev/kvm unavailable or not writable — the functional + visual suites need a live LuCI VM and were skipped. The review gallery (built from committed baselines) still publishes."
          fi

      - name: Run functional suite
        if: steps.kvm.outputs.available == 'true'
        working-directory: tests/ui
        env:
          # global-setup.js -> run.sh --serve reads CA_IT_APK_DIR for the apks.
          CA_IT_APK_DIR: ${{ github.workspace }}/apks
          CA_IT_REQUIRE_KVM: "1"
        run: npx playwright test --project=functional

      - name: Run visual suite (diff is advisory — never gates the pipeline)
        if: steps.kvm.outputs.available == 'true'
        working-directory: tests/ui
        env:
          CA_IT_APK_DIR: ${{ github.workspace }}/apks
          CA_IT_REQUIRE_KVM: "1"
        # Baselines are environment-specific (fonts/GPU); a pixel diff must not
        # fail CI. It uploads the HTML diff report for human review instead.
        continue-on-error: true
        run: npx playwright test --project=visual

      - name: Generate human-review gallery (from committed baselines)
        if: always()
        working-directory: tests/ui
        # Independent of KVM: the gallery is built from the committed baseline
        # PNGs, so it always publishes even when the VM steps were skipped.
        run: node visual/generate-gallery.js

      - name: UI summary
        if: always()
        run: |
          {
            echo "### UI (Playwright)"
            if [ "${{ steps.kvm.outputs.available }}" = "true" ]; then
              echo "KVM present — functional + visual suites ran against a live LuCI VM."
              echo "Visual diff is advisory (see the Playwright HTML report artifact)."
            else
              echo ":warning: **UI VM SUITES SKIPPED: no KVM** — functional + visual"
              echo "need a live LuCI VM and were skipped (visible SKIP, not a pass)."
            fi
            echo "Review gallery published as the \`ui-gallery\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report + visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/test-results/
          if-no-files-found: ignore

      - name: Upload review gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gallery
          path: tests/ui/visual/gallery/
          if-no-files-found: ignore
